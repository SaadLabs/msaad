<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f38" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64ffda" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(100, 255, 218, 0.22)" stroke-width="1.5" />

  <!-- Outer Hexagon Badge -->
  <polygon points="32 9, 52 20.5, 52 43.5, 32 55, 12 43.5, 12 20.5" fill="rgba(100, 255, 218, 0.08)" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Monogram S -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central" fill="#64ffda" font-size="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-0.5px">S</text>
</svg>
